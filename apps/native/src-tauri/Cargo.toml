[package]
name = "klaxon-v2"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "klaxon_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
tauri = { version = "=2.11.0", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# Keep debug WebViews while reducing the size of the packaged artifacts.
[profile.dev.package.klaxon-v2]
strip = "debuginfo"
