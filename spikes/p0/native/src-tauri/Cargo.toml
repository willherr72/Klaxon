[package]
name = "klaxon-p0-native"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "klaxon-p0-native"

[lib]
name = "klaxon_p0_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
tauri = { version = "=2.11.0", features = [] }

[target.'cfg(any(windows, target_os = "android"))'.dependencies]
serde = { version = "=1.0.228", optional = true, features = ["derive"] }
serde_json = { version = "=1.0.149", optional = true }
reqwest = { version = "=0.13.3", optional = true, default-features = false, features = ["json"] }
rustls = { version = "=0.23.44", optional = true, default-features = false, features = ["ring"] }
webpki-roots = { version = "=1.0.9", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "=0.21.1", optional = true }

[target.'cfg(windows)'.dependencies]
base64 = { version = "=0.22.1", optional = true }
windows-sys = { version = "=0.61.2", optional = true, features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dev-dependencies]
http-body-util = "=0.1.3"
hyper = { version = "=1.9.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
reqwest = { version = "=0.13.3", default-features = false, features = ["json"] }
tokio = { version = "=1.52.2", features = ["net", "rt", "time"] }

[features]
p0-session = ["dep:jni", "dep:serde", "dep:serde_json", "dep:windows-sys"]
p0-android-provider-preflight = ["p0-session", "dep:reqwest"]
p0-windows-sign-out-http = ["p0-session", "dep:reqwest"]
p0-local-provider = ["dep:base64", "dep:reqwest", "dep:serde", "dep:serde_json", "dep:windows-sys"]
p0-hosted-provider = ["reqwest/rustls-no-provider", "dep:rustls", "dep:webpki-roots"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "windows_session"
path = "src/fixture-bins/windows_session.rs"
required-features = ["p0-session", "custom-protocol"]

[[bin]]
name = "windows_local_provider"
path = "src/fixture-bins/windows_local_provider.rs"
required-features = ["p0-local-provider", "custom-protocol"]

# Preserve debuggable WebViews while keeping the APK practical to transfer to a device.
[profile.dev.package.klaxon-p0-native]
strip = "debuginfo"
