name: Android build prerequisites
description: Shared Java, Node, Rust and NDK selection for hosted Android builds.
inputs:
  targets:
    description: Rust Android target triples
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: android-actions/setup-android@v3
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
        cache: npm
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: '1.97.1'
        targets: ${{ inputs.targets }}
    - name: Select the release NDK
      shell: bash
      run: |
        set -euo pipefail
        sdkmanager --install 'ndk;27.1.12297006' 'build-tools;36.0.0' 'platforms;android-36'
        # Tauri resolves libc++ independently of Gradle. In this ephemeral
        # hosted SDK, retaining only the pinned NDK makes both agree.
        for directory in "${ANDROID_HOME:?}/ndk/"*; do
          [ "$(basename "$directory")" = '27.1.12297006' ] || rm -rf -- "$directory"
        done
        for variable in NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK_LATEST_HOME; do
          echo "$variable=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
        done
