name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      lifecycle_probe:
        description: Optional Activity diagnostic (normally leave none)
        type: choice
        options: [none, recreate, finish]
        default: none
  workflow_call:
    inputs:
      extended:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Windows validation
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Shared local and CI verification
        run: npm run verify
      - name: Extended release transport recovery
        if: inputs.extended
        working-directory: src-tauri
        timeout-minutes: 10
        run: cargo run --locked --example sync_recovery
      - name: Zero-warning Windows build
        working-directory: src-tauri
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --locked
  android:
    name: ${{ inputs.lifecycle_probe && inputs.lifecycle_probe != 'none' && 'Android Activity diagnostic' || 'Android smoke' }}
    uses: ./.github/workflows/android-tests.yml
    with:
      extended: ${{ inputs.extended || false }}
      lifecycle_probe: ${{ inputs.lifecycle_probe != 'none' && inputs.lifecycle_probe || '' }}
