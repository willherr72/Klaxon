name: V2 validation

on:
  pull_request:
    branches: [v2]

permissions:
  contents: read

concurrency:
  group: v2-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Frontend and migration rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      fixture-id: ${{ steps.fixture.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Verify shared frontend and repository tooling
        run: |
          npm ci
          npm run verify -- --frontend
      - name: Test Android verification harness
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Rehearse migration with synthetic data
        run: python3 spikes/migration/probe.py
      - name: Check synthetic reminder evidence and one-time push fixture
        run: |
          npm ci --prefix spikes/p0/reminder-push --ignore-scripts --no-audit --no-fund
          node --test spikes/p0/reminder-evidence.test.mjs spikes/p0/reminder-push/*.test.mjs
      - name: Build portable fixture
        working-directory: spikes/p0
        run: |
          npm ci
          npm run build
      - name: Exercise the built fixture in headless Chromium
        working-directory: spikes/p0
        run: |
          npx --no-install playwright-core install --with-deps --only-shell chromium
          npm run test:portable
      - name: Attach tested portable fixture
        id: fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: klaxon-p0-portable-fixture-${{ github.run_attempt }}
          path: spikes/p0/dist/index.html
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Unsigned Windows WebView2 rehearsal
    needs: validate
    # WebView2 automation on Server 2025: https://github.com/actions/runner-images/issues/14738
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Get the browser-tested fixture
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.validate.outputs.fixture-id }}
          path: spikes/p0/native/.frontend
          merge-multiple: true
      - name: Verify the Evergreen WebView2 Runtime
        run: ./spikes/p0/ci/webview2-runtime.ps1
      - name: Exercise the current-user DPAPI session fixture
        run: |
          $env:P0_SESSION_POWERSHELL = Join-Path $PSHOME 'pwsh.exe'
          node --test spikes/p0/native/session.test.mjs
      - name: Build isolated Tauri executable
        working-directory: spikes/p0
        run: cargo build --locked --manifest-path native/src-tauri/Cargo.toml --features custom-protocol
      - name: Install the native smoke test dependencies
        working-directory: spikes/p0
        run: npm ci
      - name: Run the fixture in the Windows executable
        working-directory: spikes/p0
        run: node native/smoke.mjs windows
      - name: Build the offline Windows session fixture
        working-directory: spikes/p0
        run: node native/package.mjs --target windows --session
      - name: Check packaged DPAPI resume and sign-out in WebView2
        working-directory: spikes/p0
        run: node native/smoke.mjs windows-session
