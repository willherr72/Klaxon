# Installer builds, so a downloadable desktop build exists without anyone's
# laptop being involved.
#
# Deliberately separate from ci.yml: that workflow is the fast gate on every
# push and PR (~5 minutes), and a release-profile Rust build is several times
# that. Keeping them apart means slow builds never delay review feedback.
#
# The Android APK produced here is UNSIGNED, on purpose. The release keystore
# stays on the maintainer's machine — Android refuses to update an app across
# a signing-key change, so a leaked or rotated key would force every device to
# reinstall and lose its data. This job exists to catch build breakage (NDK,
# Gradle, the vendored notification plugin, the Kotlin sources), which
# previously only surfaced while cutting a release. Shippable APKs are still
# built locally.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Separate cache key from ci.yml's: that job builds the dev profile,
      # this one release, and sharing a key means each evicts the other.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build installer
        run: npm run tauri build

      # Asset names are a contract with the updater: it looks for an exact
      # `x64-setup.exe` suffix (see updates.rs). Uploading the bundle
      # directory keeps whatever names Tauri produced.
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: klaxon-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install the NDK the Rust plugin links against
        run: sdkmanager --install "ndk;27.1.12297006"

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Only arm64. Every device this ships to is arm64, and building the
          # other three ABIs triples the job for no extra signal.
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `gen/android` is tracked, but the handful of files Tauri derives from
      # tauri.conf.json are not (its own .gitignore excludes them):
      # tauri.settings.gradle, app/tauri.build.gradle.kts, app/tauri.properties.
      # settings.gradle and app/build.gradle.kts `apply from` them, so Gradle
      # cannot configure without them. `android init` regenerates the lot —
      # including our customized build.gradle.kts, manifest and Kotlin — so we
      # immediately restore the tracked versions and keep only the generated
      # extras. Regenerating rather than tracking them is also correct: they
      # encode the app version, which must never be stale.
      - name: Regenerate Tauri's derived Gradle files
        run: |
          npm run tauri -- android init
          git checkout -- src-tauri/gen/android
          git status --short src-tauri/gen/android

      - name: Build APK (unsigned)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        run: npm run tauri -- android build --target aarch64 --apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: klaxon-android-arm64-unsigned
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
