name: Build
# Release tags reuse these exact-commit artifacts instead of rebuilding.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: node scripts/release-check.mjs versions
      - name: Build Windows installer
        run: npm run tauri -- build --bundles nsis
      - name: Verify installer and record provenance
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "src-tauri/target/release/bundle/nsis/Klaxon_${version}_x64-setup.exe"
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          Copy-Item -LiteralPath $installer -Destination release-artifacts
          node scripts/release-check.mjs windows --file "release-artifacts/Klaxon_${version}_x64-setup.exe" --output release-artifacts/windows-report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: klaxon-windows-x64
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 3
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-build-setup
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-arm64
      - run: npm ci
      - run: node scripts/release-check.mjs versions
      - name: Regenerate derived Gradle files
        run: |
          npm run tauri -- android init
          git restore -- src-tauri/gen/android
      - name: Build unsigned arm64 APK
        run: npm run tauri -- android build --target aarch64 --apk
      - name: Verify NDK, APK and source revision
        run: |
          set -euo pipefail
          library=src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          case "$(readlink -f "$library")" in
            */ndk/27.1.12297006/*) ;;
            *) echo 'Unexpected NDK library'; exit 1 ;;
          esac
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          mkdir -p release-artifacts
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk "release-artifacts/klaxon-$version-arm64.apk"
          node scripts/release-check.mjs android --allow-unsigned \
            --file "release-artifacts/klaxon-$version-arm64.apk" \
            --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --output release-artifacts/android-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: klaxon-android-arm64-unsigned
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 3
