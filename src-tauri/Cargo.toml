[package]
name = "klaxon"
version = "0.7.3"
description = "A reminder app that gets your attention"
authors = ["Will Herr"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "klaxon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# v0.5.2 backups: file dialogs (desktop save/open, Android SAF open) and
# fs (reads Android content:// URIs the dialog returns).
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
# Backup export encryption: Argon2id KDF + AES-256-GCM. Pure Rust, so it
# cross-compiles for Android without ceremony. GCM's tag doubles as
# tamper detection.
argon2 = "0.5"
aes-gcm = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
rodio = "0.19"
rand = "0.8"
hex = "0.4"
local-ip-address = "0.6"
mdns-sd = "0.13"
sha2 = "0.10"
rustls = "0.23"

# v0.3 iroh transport — phase 1 wires up an Endpoint alongside the existing
# HTTPS sync server. Cutover to iroh-only happens in a later phase.
#
# `portmapper` (default) pulls in netwatch → wmi 0.18.4, which has its own
# windows-core version conflict on Windows. We get along fine without UPnP
# port mapping — iroh's hole-punching + relays are the primary NAT traversal
# path. `tls-ring` and `metrics` re-added because they're useful defaults.
iroh = { version = "1.0.3", default-features = false, features = ["tls-ring", "metrics"] }
# postcard: small, fast, schema-less serde format. Used to encode RPC
# envelopes (length-prefixed) on iroh bidi streams.
postcard = { version = "1", features = ["alloc"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# v0.4: desktop-only deps — system tray, global hotkeys, autostart, and
# the single-instance plugin all assume a windowed desktop OS. Gating
# them by target so the Android build doesn't try to compile them.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"

# v0.5.1: suspend/resume notifications for the sync loop (WM_POWERBROADCAST
# via a message-only window). 0.62 to match the copy already in the
# dependency tree via tauri, not to add a third.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    # WNDCLASSW / RegisterClassW are gated here (the struct embeds GDI types).
    "Win32_Graphics_Gdi",
    # v0.7.2 net_watch.rs: NotifyIpInterfaceChange + ADDRESS_FAMILY.
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

# v0.4: Android-only. We initialize the global ndk-context (JavaVM + Android
# Context) ourselves from MainActivity — Tauri/wry never set it, but crates
# that read it (hickory-resolver via iroh's DNS; cpal) panic with "android
# context was not initialized" and abort the process in a release build.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
# v0.6: route Rust log:: output to logcat. env_logger writes to stderr,
# which Android discards — Rust logs were invisible on-device, warm or
# cold, which made cold-path failures silent.
android_logger = "0.14"

# Vendored fork of tauri-plugin-notification 2.3.3 with a one-line
# fix to NotificationStorage.writeActionGroup — upstream stores
# action titles under the wrong SharedPreferences keys, so every
# scheduled notification's action buttons render with empty titles
# and do nothing. See vendor/tauri-plugin-notification/.../
# NotificationStorage.kt for the patch. Remove once upstream merges
# the fix and we bump past 2.3.3.
[patch.crates-io]
tauri-plugin-notification = { path = "../vendor/tauri-plugin-notification" }
